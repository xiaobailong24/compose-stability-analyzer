name: Build Demo APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-demo:
    name: Build Demo APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out code
        uses: actions/checkout@v5.0.0

      - name: Set up JDK
        uses: actions/setup-java@v5.0.0
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Cache Gradle and wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Publish modules to Maven Local
        run: ./gradlew publishToMavenLocal -x test -x lint --no-daemon --stacktrace -PRELEASE_SIGNING_ENABLED=false

      - name: Build debug APK
        run: |
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build-output.log
          exit ${PIPESTATUS[0]}

      - name: Post build errors to PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('build-output.log', 'utf8');
            const lines = log.split('\n');
            const errorLines = lines.filter(l =>
              l.includes('e: ') || l.includes('FAILURE') || l.includes('BUILD FAILED') ||
              l.includes('error:') || l.includes('Execution failed')
            );
            const last50 = lines.slice(-50).join('\n');
            const body = `### Build Demo APK Failed\n\n**Error lines:**\n\`\`\`\n${errorLines.join('\n')}\n\`\`\`\n\n**Last 50 lines:**\n\`\`\`\n${last50}\n\`\`\``;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body.substring(0, 65000)
            });

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-output.log
          retention-days: 7

      - name: Upload demo APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: demo-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
