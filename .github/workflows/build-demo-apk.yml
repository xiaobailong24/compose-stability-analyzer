name: Build Demo APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-demo:
    name: Build Demo APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out code
        uses: actions/checkout@v5.0.0

      - name: Set up JDK
        uses: actions/setup-java@v5.0.0
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Cache Gradle and wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run stability-ui unit tests
        run: |
          ./gradlew :stability-ui:testDebugUnitTest -PskipStabilityAnalyzer --stacktrace 2>&1 | tee build-output.log
          exit ${PIPESTATUS[0]}

      - name: Build debug APK and test APK
        run: |
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PskipStabilityAnalyzer --stacktrace 2>&1 | tee -a build-output.log
          exit ${PIPESTATUS[0]}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest -PskipStabilityAnalyzer --stacktrace
      - name: Post build errors to PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('build-output.log', 'utf8'); } catch(e) {}
            const lines = log.split('\n');
            const errorLines = lines.filter(l =>
              (l.includes('e: ') || l.includes('FAILURE') || l.includes('BUILD FAILED') ||
               l.includes('Execution failed') || l.includes('> Could not') ||
               l.includes('Exception') || l.includes('error:')) &&
              !l.includes('WARNING: D8:')
            ).slice(0, 50);
            const last80 = lines.slice(-80).join('\n');
            const body = `### Build Demo APK Failed\n\n**Error lines:**\n\`\`\`\n${errorLines.join('\n')}\n\`\`\`\n\n**Last 80 lines:**\n\`\`\`\n${last80}\n\`\`\``;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body.substring(0, 65000)
            });

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            build-output.log
          retention-days: 7

      - name: Upload demo APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: demo-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
